[project]
name = "shadowscan"
version = "0.1.0"
description = "Shadow AI Scanner"
authors = [
    {name = "Alex V",email = "valentinealex1404@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-nmap (>=0.7.1,<0.8.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
shadow-scan = "ShadowScanner.main:app"
